<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="dk">
  <title id="dk">Detail kanopi pasar: kolom beton, talang air hujan, pipa turun, dan bangku di bawahnya.</title>
  <rect width="1600" height="700" fill="#F6F2EA"/>

  <!-- sky -->
  <rect width="1600" height="520" fill="#E9E1D2"/>

  <!-- roof slab -->
  <rect x="60" y="60" width="1480" height="46" fill="#CFC5B4"/>
  <rect x="60" y="60" width="1480" height="10" fill="#12100E"/>
  <path d="M60 106h1480" stroke="#12100E" stroke-width="1.5" opacity=".4"/>

  <!-- tapered columns -->
  <g fill="#D8CFBE" stroke="#12100E" stroke-width="1.6" stroke-opacity=".45">
    <path d="M240 106h54l16 414h-86z"/>
    <path d="M760 106h54l16 414h-86z"/>
    <path d="M1280 106h54l16 414h-86z"/>
  </g>
  <g fill="#12100E" opacity=".12">
    <path d="M240 106h54l4 60h-62z"/>
    <path d="M760 106h54l4 60h-62z"/>
    <path d="M1280 106h54l4 60h-62z"/>
  </g>

  <!-- gutter + downpipe -->
  <rect x="56" y="106" width="20" height="14" fill="#12100E" opacity=".8"/>
  <path d="M66 120v70h-34v210" stroke="#12100E" stroke-width="10" fill="none" opacity=".75"/>
  <path d="M66 120v70h-34v210" stroke="#8FA6A0" stroke-width="4" fill="none" opacity=".8"/>
  <rect x="8" y="400" width="48" height="60" fill="#8FA6A0" opacity=".55"/>
  <path d="M32 460v60" stroke="#8FA6A0" stroke-width="4" opacity=".7"/>

  <!-- rainwater arrows -->
  <g stroke="#8FA6A0" stroke-width="2" opacity=".5" fill="none">
    <path d="M66 132v40"/>
    <path d="M58 164l8 10 8-10"/>
    <path d="M32 470v40"/>
    <path d="M24 502l8 10 8-10"/>
  </g>

  <!-- roof overhang shadow -->
  <rect x="60" y="112" width="1480" height="10" fill="#12100E" opacity=".08"/>

  <!-- vendor stall -->
  <g>
    <rect x="360" y="330" width="360" height="190" fill="#EFEAE1"/>
    <rect x="360" y="330" width="360" height="18" fill="#B4432A"/>
    <g fill="#B4432A" opacity=".85">
      <path d="M360 348h60v172h-60zM480 348h60v172h-60zM600 348h60v172h-60z"/>
    </g>
    <g fill="#EFEAE1" opacity=".65">
      <path d="M420 348h60v172h-60zM540 348h60v172h-60zM660 348h60v172h-60z"/>
    </g>
    <rect x="380" y="400" width="300" height="12" fill="#12100E" opacity=".2"/>
  </g>

  <!-- bench -->
  <g>
    <rect x="900" y="470" width="260" height="16" fill="#8A6A45"/>
    <path d="M930 486v74M1130 486v74" stroke="#12100E" stroke-width="8"/>
    <path d="M900 470h260" stroke="#12100E" stroke-width="1" opacity=".4"/>
  </g>

  <!-- tree in planter -->
  <g>
    <rect x="1190" y="440" width="120" height="120" fill="#D8CFBE"/>
    <rect x="1190" y="440" width="120" height="12" fill="#12100E" opacity=".5"/>
    <path d="M1250 440V330" stroke="#12100E" stroke-width="7"/>
    <circle cx="1250" cy="300" r="56" fill="#6F7A5E"/>
    <circle cx="1210" cy="330" r="34" fill="#2F3A33"/>
    <circle cx="1290" cy="332" r="30" fill="#6F7A5E"/>
  </g>

  <!-- people -->
  <g fill="#12100E" opacity=".65">
    <circle cx="620" cy="452" r="10"/><rect x="611" y="463" width="18" height="57" rx="8"/>
    <circle cx="700" cy="466" r="8"/><rect x="693" y="475" width="15" height="45" rx="7"/>
    <circle cx="1030" cy="430" r="9"/><rect x="1022" y="440" width="16" height="30" rx="7"/>
  </g>

  <!-- ground -->
  <rect y="560" width="1600" height="140" fill="#CFC5B4"/>
  <path d="M0 560h1600" stroke="#12100E" stroke-width="2" opacity=".5"/>
  <g stroke="#12100E" stroke-width="1" opacity=".18">
    <path d="M100 600h1400M100 640h1400M100 680h1400"/>
    <path d="M200 560v140M360 560v140M520 560v140M680 560v140M840 560v140M1000 560v140M1160 560v140M1320 560v140"/>
  </g>

  <!-- dims -->
  <g stroke="#12100E" stroke-width=".8" opacity=".3">
    <path d="M1500 60v500"/><path d="M1492 60h16"/><path d="M1492 560h16"/>
  </g>
  <text x="1518" y="320" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#12100E" opacity=".45" transform="rotate(-90 1518 320)">5 400</text>

  <g font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#12100E" opacity=".5">
    <text x="40" y="46">DETAIL KANOPI · SKALA 1:20</text>
    <text x="900" y="640">TALANG &amp; PIPA TURUN 100 MM</text>
    <text x="1200" y="640">PENAMPUNG AIR 2 000 L</text>
  </g>
</svg>
