    <rect x="208" y="220" width="354" height="12"/>
    <rect x="208" y="300" width="354" height="12"/>
    <rect x="208" y="380" width="354" height="12"/>
    <rect x="208" y="460" width="354" height="12"/>
  </g>

  <!-- vertical slats -->
  <g stroke="#8A6A45" stroke-width="4" opacity=".7">
    <path d="M244 60v480M268 60v480M292 60v480M316 60v480M340 60v480M364 60v480M388 60v480M412 60v480M436 60v480M460 60v480M484 60v480M508 60v480M532 60v480"/>
  </g>

  <!-- balconies -->
  <g fill="#12100E" opacity=".82">
    <rect x="196" y="152" width="56" height="68"/>
    <rect x="196" y="232" width="56" height="68"/>
    <rect x="196" y="312" width="56" height="68"/>
    <rect x="518" y="392" width="56" height="68"/>
    <rect x="518" y="472" width="56" height="68"/>
