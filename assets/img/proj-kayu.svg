<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t2">
  <title id="t2">Menara Kayu: enam lantai struktur kayu dengan balkon menjorok dan tangga luar.</title>
  <defs>
    <linearGradient id="k-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCD3C2"/><stop offset="1" stop-color="#E9E1D2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#k-sky)"/>
  <circle cx="640" cy="120" r="92" fill="#C9704A" opacity=".9"/>

  <!-- neighbouring low block -->
  <rect x="20" y="360" width="150" height="180" fill="#CFC5B4"/>
  <rect x="20" y="360" width="150" height="12" fill="#12100E"/>
  <g fill="#2F3A33" opacity=".9"><rect x="44" y="400" width="34" height="60"/><rect x="96" y="400" width="34" height="60"/></g>

  <!-- tower -->
  <rect x="220" y="60" width="330" height="480" fill="#D6B78E"/>
  <rect x="206" y="46" width="358" height="18" fill="#12100E"/>
  <rect x="220" y="60" width="330" height="480" fill="none" stroke="#12100E" stroke-width="1.2" opacity=".25"/>

  <!-- floor slabs -->
  <g fill="#B4432A">
