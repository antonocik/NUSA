<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="pl">
  <title id="pl">Denah studio NUSA: ruang gambar terbuka, perpustakaan material, ruang rapat, dapur, tangga, dan taman dalam.</title>
  <rect width="1600" height="900" fill="#F6F2EA"/>

  <!-- grid -->
  <g stroke="#12100E" stroke-width=".5" opacity=".06">
    <path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600M0 500H1600M0 600H1600M0 700H1600M0 800H1600"/>
    <path d="M100 0V900M200 0V900M300 0V900M400 0V900M500 0V900M600 0V900M700 0V900M800 0V900M900 0V900M1000 0V900M1100 0V900M1200 0V900M1300 0V900M1400 0V900M1500 0V900"/>
  </g>

  <!-- outer walls -->
  <rect x="120" y="120" width="1360" height="640" fill="none" stroke="#12100E" stroke-width="6" opacity=".85"/>
  <rect x="126" y="126" width="1348" height="628" fill="none" stroke="#12100E" stroke-width="1" opacity=".18"/>

  <!-- entrance opening -->
  <rect x="200" y="752" width="150" height="16" fill="#F6F2EA"/>
  <path d="M200 760a75 75 0 0 1 150 0" fill="none" stroke="#12100E" stroke-width="1" opacity=".35" stroke-dasharray="4 4"/>
  <text x="212" y="800" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#12100E" opacity=".45">MASUK</text>

  <!-- internal partitions -->
  <g stroke="#12100E" stroke-width="4" opacity=".75">
    <path d="M900 120v260"/>
    <path d="M900 520h580"/>
    <path d="M1180 380v260"/>
  </g>

  <!-- stair -->
  <g stroke="#12100E" stroke-width="1.4" opacity=".55">
    <rect x="1000" y="150" width="150" height="200" fill="none"/>
    <path d="M1000 175h150M1000 200h150M1000 225h150M1000 250h150M1000 275h150M1000 300h150M1000 325h150"/>
    <path d="M1075 150v200" stroke-dasharray="6 4"/>
  </g>
  <text x="1012" y="372" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#12100E" opacity=".4">TANGGA</text>

  <!-- meeting room -->
  <rect x="1210" y="140" width="250" height="210" fill="none" stroke="#12100E" stroke-width="1" opacity=".35"/>
  <rect x="1250" y="200" width="170" height="80" rx="4" fill="none" stroke="#12100E" stroke-width="2" opacity=".55"/>
  <g fill="none" stroke="#12100E" stroke-width="2" opacity=".45">
    <circle cx="1270" cy="185" r="11"/><circle cx="1335" cy="180" r="11"/><circle cx="1400" cy="185" r="11"/>
    <circle cx="1270" cy="295" r="11"/><circle cx="1335" cy="300" r="11"/><circle cx="1400" cy="295" r="11"/>
  </g>
  <text x="1214" y="336" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#12100E" opacity=".4">RAPAT · 8 ORANG</text>

  <!-- material library -->
  <g stroke="#12100E" stroke-width="1.6" opacity=".5" fill="none">
    <rect x="1210" y="410" width="250" height="70"/>
    <rect x="1210" y="510" width="250" height="70"/>
    <rect x="1210" y="610" width="250" height="70"/>
    <path d="M1272 410v70M1334 410v70M1396 410v70M1272 510v70M1334 510v70M1396 510v70M1272 610v70M1334 610v70M1396 610v70"/>
  </g>
  <text x="1214" y="724" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#12100E" opacity=".4">MATERIAL · 214 SAMPEL</text>

  <!-- courtyard -->
  <rect x="520" y="540" width="340" height="200" fill="#E7E0D2"/>
  <rect x="520" y="540" width="340" height="200" fill="none" stroke="#12100E" stroke-width="1.4" opacity=".35"/>
  <g fill="none" stroke="#12100E" stroke-width="1.6" opacity=".55">
    <circle cx="700" cy="630" r="62"/>
    <circle cx="660" cy="660" r="34"/>
    <circle cx="742" cy="658" r="30"/>
  </g>
  <path d="M700 692v46" stroke="#12100E" stroke-width="2" opacity=".4"/>
  <text x="530" y="570" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#12100E" opacity=".4">TAMAN DALAM</text>

  <!-- kitchen -->
  <rect x="140" y="600" width="210" height="60" fill="none" stroke="#12100E" stroke-width="2" opacity=".55"/>
  <g stroke="#12100E" stroke-width="1" opacity=".45">
    <circle cx="190" cy="630" r="14"/><circle cx="230" cy="630" r="14"/>
    <rect x="270" y="610" width="60" height="40"/>
  </g>
  <text x="142" y="690" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#12100E" opacity=".4">DAPUR</text>

  <!-- desks -->
  <g fill="none" stroke="#12100E" stroke-width="2" opacity=".55">
    <rect x="200" y="220" width="150" height="66"/>
    <rect x="200" y="320" width="150" height="66"/>
    <rect x="390" y="220" width="150" height="66"/>
    <rect x="390" y="320" width="150" height="66"/>
    <rect x="580" y="220" width="150" height="66"/>
    <rect x="580" y="320" width="150" height="66"/>
  </g>
  <g fill="none" stroke="#12100E" stroke-width="1.6" opacity=".45">
    <circle cx="275" cy="200" r="12"/><circle cx="275" cy="410" r="12"/>
    <circle cx="465" cy="200" r="12"/><circle cx="465" cy="410" r="12"/>
    <circle cx="655" cy="200" r="12"/><circle cx="655" cy="410" r="12"/>
  </g>
  <g fill="none" stroke="#12100E" stroke-width="1.2" opacity=".3">
    <rect x="225" y="240" width="42" height="26"/><rect x="415" y="240" width="42" height="26"/><rect x="605" y="240" width="42" height="26"/>
    <rect x="225" y="340" width="42" height="26"/><rect x="415" y="340" width="42" height="26"/><rect x="605" y="340" width="42" height="26"/>
  </g>

  <!-- model table + plotter -->
  <rect x="250" y="500" width="190" height="70" fill="none" stroke="#12100E" stroke-width="2" opacity=".55"/>
  <rect x="278" y="520" width="40" height="30" fill="none" stroke="#12100E" stroke-width="1" opacity=".4"/>
  <rect x="330" y="516" width="56" height="34" fill="none" stroke="#12100E" stroke-width="1" opacity=".4"/>
  <text x="252" y="588" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#12100E" opacity=".4">MAKET</text>

  <rect x="760" y="420" width="110" height="40" fill="none" stroke="#12100E" stroke-width="2" opacity=".5"/>
  <text x="764" y="480" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#12100E" opacity=".4">PLOTTER</text>

  <text x="200" y="178" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#12100E" opacity=".4">RUANG GAMBAR · 96 M²</text>

  <!-- dims -->
  <g stroke="#12100E" stroke-width=".8" opacity=".3">
    <path d="M120 90h1360"/><path d="M120 82v16"/><path d="M1480 82v16"/>
    <path d="M90 120v640"/><path d="M82 120h16"/><path d="M82 760h16"/>
  </g>
  <text x="760" y="78" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#12100E" opacity=".45">15 400</text>
  <text x="74" y="440" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#12100E" opacity=".45" transform="rotate(-90 74 440)">8 000</text>

  <!-- north arrow -->
  <g transform="translate(1520 60)">
    <circle r="22" fill="none" stroke="#12100E" stroke-width="1" opacity=".35"/>
    <path d="M0 -14L6 8L0 4L-6 8Z" fill="#B4432A"/>
    <text y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#12100E" opacity=".45">N</text>
  </g>

  <!-- scale bar -->
  <g transform="translate(120 830)">
    <path d="M0 0h240" stroke="#12100E" stroke-width="1" opacity=".4"/>
    <path d="M0 -5v10M80 -5v10M160 -5v10M240 -5v10" stroke="#12100E" stroke-width="1" opacity=".4"/>
    <text y="22" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1.5" fill="#12100E" opacity=".4">0         2         4         6 M</text>
  </g>
  <text x="1480" y="840" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#12100E" opacity=".4">DENAH STUDIO · SKALA 1:75 · NUSA</text>
</svg>
