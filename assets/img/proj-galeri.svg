<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t4">
  <title id="t4">Galeri Candi: ruang batu dengan atap piramida dan berkas cahaya dari skylight.</title>
  <rect width="800" height="600" fill="#DED5C5"/>
  <rect y="470" width="800" height="130" fill="#C9BFAE"/>

  <!-- stone hall -->
  <rect x="80" y="150" width="640" height="320" fill="#CFC5B4"/>
  <rect x="80" y="150" width="640" height="20" fill="#12100E"/>
  <rect x="80" y="150" width="640" height="320" fill="none" stroke="#12100E" stroke-width="1.2" opacity=".25"/>

  <!-- pyramid ceiling opening -->
  <path d="M400 60l250 90H150z" fill="#2F3A33"/>
  <path d="M400 78l190 72H210z" fill="#12100E"/>
  <path d="M400 78v144" stroke="#C9704A" stroke-width="3" opacity=".8"/>

  <!-- light beam -->
  <path d="M330 150h140l180 320H150z" fill="#F6F2EA" opacity=".28"/>

  <!-- object: monolith -->
  <rect x="356" y="318" width="88" height="152" fill="#B4432A"/>
  <rect x="356" y="318" width="88" height="12" fill="#8E3421"/>
  <ellipse cx="400" cy="470" rx="72" ry="12" fill="#12100E" opacity=".18"/>

  <!-- side niches -->
  <g fill="#2F3A33">
    <rect x="120" y="250" width="84" height="200"/>
    <rect x="596" y="250" width="84" height="200"/>
  </g>
  <g fill="#EFEAE1" opacity=".85">
    <rect x="140" y="320" width="44" height="6"/><rect x="140" y="344" width="30" height="6"/>
    <rect x="616" y="320" width="44" height="6"/><rect x="616" y="344" width="30" height="6"/>
  </g>

  <!-- stairs foreground -->
  <g fill="#D8CFBE">
    <rect x="0" y="470" width="800" height="18"/>
    <rect x="60" y="488" width="680" height="18"/>
    <rect x="120" y="506" width="560" height="18"/>
    <rect x="180" y="524" width="440" height="18"/>
  </g>
  <g stroke="#12100E" stroke-width="1" opacity=".18">
    <path d="M0 488h800M60 506h740M120 524h680M180 542h620"/>
  </g>

  <!-- visitors -->
  <g fill="#12100E" opacity=".65">
    <circle cx="300" cy="420" r="8"/><rect x="292" y="430" width="16" height="42" rx="7"/>
    <circle cx="486" cy="428" r="6"/><rect x="480" y="436" width="12" height="34" rx="5"/>
  </g>

  <text x="20" y="586" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2.5" fill="#12100E" opacity=".4">GALERI BUDAYA · 2022</text>
</svg>
