<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t6">
  <title id="t6">Studio Sendiri: fasad ruko sempit dengan jendela besar, tangga kayu, dan meja gambar.</title>
  <rect width="800" height="600" fill="#E4DBCB"/>
  <rect y="510" width="800" height="90" fill="#CFC5B4"/>

  <!-- neighbours -->
  <g fill="#C9BFAE">
    <rect x="0" y="170" width="130" height="340"/>
    <rect x="670" y="140" width="130" height="370"/>
  </g>
  <g fill="#12100E" opacity=".1">
    <rect x="0" y="170" width="130" height="16"/><rect x="670" y="140" width="130" height="16"/>
  </g>
  <g fill="#2F3A33" opacity=".55">
    <rect x="22" y="230" width="40" height="60"/><rect x="80" y="230" width="34" height="60"/>
    <rect x="700" y="210" width="40" height="60"/><rect x="758" y="210" width="30" height="60"/>
  </g>

  <!-- studio facade -->
  <rect x="130" y="90" width="540" height="420" fill="#D8CFBE"/>
  <rect x="118" y="76" width="564" height="16" fill="#12100E"/>
  <rect x="130" y="90" width="540" height="420" fill="none" stroke="#12100E" stroke-width="1.2" opacity=".25"/>

  <!-- big glazing -->
  <rect x="168" y="150" width="464" height="286" fill="#2F3A33"/>
  <g stroke="#E4DBCB" stroke-width="5" opacity=".55">
    <path d="M323 150v286M478 150v286M168 293h464"/>
  </g>

  <!-- interior: stair, table, lamp -->
  <g stroke="#E4DBCB" stroke-width="3" opacity=".9" fill="none">
    <path d="M540 436V352h44V300h44V248h44"/>
  </g>
  <g fill="#E4DBCB" opacity=".85">
    <rect x="540" y="404" width="40" height="8"/><rect x="584" y="352" width="40" height="8"/>
    <rect x="628" y="300" width="40" height="8"/>
  </g>
  <rect x="214" y="380" width="150" height="8" fill="#E4DBCB"/>
  <path d="M224 388v48M354 388v48" stroke="#E4DBCB" stroke-width="4"/>
  <circle cx="290" cy="256" r="18" fill="#C9704A"/>
  <path d="M290 274v60" stroke="#E4DBCB" stroke-width="2" opacity=".6"/>

  <!-- door -->
  <rect x="660" y="330" width="0" height="0"/>
  <rect x="640" y="230" width="0" height="0"/>

  <!-- entry door right -->
  <rect x="648" y="320" width="0" height="0"/>
  <rect x="130" y="452" width="540" height="58" fill="#B4432A"/>
  <rect x="130" y="452" width="540" height="10" fill="#12100E"/>
  <g fill="#E4DBCB" opacity=".8"><rect x="196" y="476" width="60" height="6"/><rect x="600" y="476" width="34" height="6"/></g>

  <!-- steps -->
  <g fill="#D8CFBE">
    <rect x="100" y="510" width="600" height="14"/>
    <rect x="80" y="524" width="640" height="14"/>
  </g>

  <!-- plants -->
  <g fill="#6F7A5E">
    <ellipse cx="118" cy="500" rx="26" ry="40"/>
    <ellipse cx="196" cy="506" rx="18" ry="30"/>
  </g>

  <!-- figure -->
  <g fill="#12100E" opacity=".6">
    <circle cx="420" cy="466" r="7"/><rect x="413" y="475" width="14" height="34" rx="6"/>
  </g>

  <text x="20" y="588" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2.5" fill="#12100E" opacity=".4">KANTOR STUDIO · 2019</text>
</svg>
