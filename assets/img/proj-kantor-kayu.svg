<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t">
  <title id="t">Kantor Kayu Lapis: gudang 1980-an yang diubah menjadi kantor di Jakarta.</title>
  <rect width="800" height="600" fill="#E4DBCB"/>
  <rect y="470" width="800" height="130" fill="#CFC5B4"/>
  <path d="M0 470h800" stroke="#12100E" stroke-width="1.5" opacity=".45"/>

  <!-- brick warehouse shell -->
  <rect x="90" y="150" width="620" height="320" fill="#8E3421"/>
  <g fill="#7A2D1E" opacity=".55">
    <rect x="90" y="170" width="620" height="6"/>
    <rect x="90" y="190" width="620" height="6"/>
    <rect x="90" y="210" width="620" height="6"/>
    <rect x="90" y="230" width="620" height="6"/>
    <rect x="90" y="250" width="620" height="6"/>
    <rect x="90" y="270" width="620" height="6"/>
    <rect x="90" y="290" width="620" height="6"/>
    <rect x="90" y="310" width="620" height="6"/>
    <rect x="90" y="330" width="620" height="6"/>
    <rect x="90" y="350" width="620" height="6"/>
    <rect x="90" y="370" width="620" height="6"/>
    <rect x="90" y="390" width="620" height="6"/>
    <rect x="90" y="410" width="620" height="6"/>
    <rect x="90" y="430" width="620" height="6"/>
    <rect x="90" y="450" width="620" height="6"/>
  </g>

  <!-- existing high windows -->
  <g fill="#9FB2AA">
    <rect x="120" y="180" width="60" height="34"/>
    <rect x="220" y="180" width="60" height="34"/>
    <rect x="320" y="180" width="60" height="34"/>
    <rect x="420" y="180" width="60" height="34"/>
    <rect x="520" y="180" width="60" height="34"/>
    <rect x="620" y="180" width="60" height="34"/>
  </g>
  <g stroke="#12100E" stroke-width="1" opacity=".4">
    <rect x="120" y="180" width="60" height="34"/>
    <rect x="220" y="180" width="60" height="34"/>
    <rect x="320" y="180" width="60" height="34"/>
    <rect x="420" y="180" width="60" height="34"/>
    <rect x="520" y="180" width="60" height="34"/>
    <rect x="620" y="180" width="60" height="34"/>
  </g>

  <!-- timber mezzanine -->
  <rect x="90" y="300" width="620" height="14" fill="#6F5136"/>
  <g fill="#6F5136" opacity=".85">
    <rect x="110" y="314" width="14" height="156"/>
    <rect x="220" y="314" width="14" height="156"/>
    <rect x="330" y="314" width="14" height="156"/>
    <rect x="440" y="314" width="14" height="156"/>
    <rect x="550" y="314" width="14" height="156"/>
    <rect x="660" y="314" width="14" height="156"/>
  </g>
  <!-- timber floor planks -->
  <g stroke="#12100E" stroke-width=".8" opacity=".35">
    <path d="M90 307h620M90 314h620"/>
  </g>

  <!-- ground floor big openings -->
  <g fill="#9FB2AA" opacity=".9">
    <rect x="120" y="330" width="120" height="140"/>
    <rect x="300" y="330" width="200" height="140"/>
    <rect x="540" y="330" width="140" height="140"/>
  </g>
  <g stroke="#12100E" stroke-width="1.2" opacity=".4">
    <rect x="120" y="330" width="120" height="140"/>
    <rect x="300" y="330" width="200" height="140"/>
    <rect x="540" y="330" width="140" height="140"/>
  </g>
  <!-- window mullions -->
  <g stroke="#12100E" stroke-width="1" opacity=".4">
    <path d="M180 330v140M350 330v140M400 330v140M450 330v140M610 330v140"/>
  </g>

  <!-- timber canopy at entrance -->
  <rect x="90" y="126" width="620" height="24" fill="#6F5136"/>
  <g fill="#12100E" opacity=".7">
    <rect x="120" y="126" width="4" height="24"/>
    <rect x="180" y="126" width="4" height="24"/>
    <rect x="240" y="126" width="4" height="24"/>
    <rect x="300" y="126" width="4" height="24"/>
    <rect x="360" y="126" width="4" height="24"/>
    <rect x="420" y="126" width="4" height="24"/>
    <rect x="480" y="126" width="4" height="24"/>
    <rect x="540" y="126" width="4" height="24"/>
    <rect x="600" y="126" width="4" height="24"/>
    <rect x="660" y="126" width="4" height="24"/>
  </g>

  <!-- sign -->
  <rect x="350" y="96" width="100" height="30" fill="#12100E"/>
  <text x="400" y="116" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#E4DBCB">NUSA</text>
</svg>